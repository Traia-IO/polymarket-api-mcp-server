[project]
name = "polymarket-api-mcp-server"
version = "0.1.0"
description = "MCP server for Polymarket API API with  authentication and  HTTP 402 payment protocol support"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0.0",
    # Pin below mcp 2.x: FastMCP lives at mcp.server.fastmcp in 1.x only.
    # mcp 2.0.0 (2026-07-28) removed that module; floating >=1.1.2 broke
    # Cloud Run cold starts when CMD used `uv run` (re-resolved at runtime).
    "mcp>=1.1.2,<2",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "starlette>=0.45.0",
    "retry>=0.9.2",
    "traia-iatp>=0.1.95",  # For d402 payment protocol and RPC fallback support
    "uvicorn>=0.37.0",
    "web3>=6.15.0",  # For blockchain payment verification
    # Polymarket CLOB v2 client (CLOB v2 cutover happened 2026-04-28 11:00 UTC).
    # The legacy `py-clob-client` returns `order_version_mismatch` on every
    # POST since the cutover. v2 stable (1.0.0) still has signing bugs per
    # upstream issue #32; 1.0.1rc1 is the working release for sig_type=2 wallets.
    "py-clob-client-v2==1.0.1rc1",
    # Unified Polymarket SDK — drives the CLOB V2 deposit-wallet flow (pUSD
    # collateral, V2 exchange, POLY_1271 signing) that py-clob-client-v2 can't.
    # Used for signature_type=3 (deposit wallet) orders. See deposit_wallet.py.
    "polymarket-client==0.1.0b13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = [
    "server.py",
    "mcp_health_check.py",
    "deposit_wallet.py",
] 